<!DOCTYPE html>
<html>
<head>
    <title>Farmer Registration Form</title>
    <link rel="stylesheet" href="form-1.css">
</head>
<body>

<form>
    <fieldset>
        <legend>Farmer Registration Form</legend>

        <label>Farmer Name:</label><br>
        <input type="text" name="fname" required><br>

        <label>Mobile Number:</label><br>
        <input type="tel" name="mobile" required><br>

        <label>Email Address:</label><br>
        <input type="email" name="email"><br>

        <label>Village:</label><br>
        <input type="text" name="village"><br>

        <label>Plot ID:</label><br>
        <input type="text" name="plotid"><br>

        <label>Crop Variety:</label><br>
        <input type="text" name="crop"><br>

        <label>Farm Area:</label><br>
        <input type="text" name="area"><br>

        <label>Irrigation Method:</label><br>
        <select>
            <option>Drip Irrigation</option>
            <option>Sprinkler Irrigation</option>
            <option>Flood Irrigation</option>
        </select><br>

        <label>Preferred Language:</label><br>
        <input type="radio" name="lang"> English
        <input type="radio" name="lang"> Hindi
        <input type="radio" name="lang"> Marathi
        <br><br>

        <label>Advisory Services Required:</label><br>
        <input type="checkbox"> Weather Updates
        <input type="checkbox"> Irrigation Advice
        <input type="checkbox"> Crop Monitoring
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </fieldset>
</form>

</body>
</html>
